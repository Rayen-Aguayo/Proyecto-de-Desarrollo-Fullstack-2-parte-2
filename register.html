<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta en La Cucina nostra</title>
    <!-- Bootstrap -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet"
    />

    <!-- Iconos -->
     <link href="assets/img/Logo.png" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-box">
    <h3>Crear Cuenta</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Nombre Completo</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control" placeholder="Ingrese su nombre completo" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control" placeholder="Ingrese su email" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar Correo Electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control" placeholder="Confirme su email" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Ingrese Una Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" placeholder="Crear una contraseña" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" placeholder="Repite la contraseña" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Telefono</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
          <input type="tel" class="form-control" placeholder="Ingrese su numero de telefono">
        </div>
      </div>
      <button type="submit" class="btn-main">Entrar</button>
    </form>
    <p class="text-center mt-3" style="font-size: 14px;">
      ¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a>
    </p>
  </div>  
  <script src="app.js"></script>
</body>
</html>
